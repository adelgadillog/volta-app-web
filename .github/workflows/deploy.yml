name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          # Remove node_modules to avoid uploading large files
          rm -rf node_modules

          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create gh-pages branch and clean it
          git checkout --orphan gh-pages-new
          git rm -rf .

          # Copy only the build output
          cp -r out/* .
          touch .nojekyll

          # Commit and push
          git add -A
          git commit -m "Deploy to gh-pages [skip ci]" || echo "Nothing to commit"
          git push origin gh-pages-new:gh-pages --force
