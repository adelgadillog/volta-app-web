name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Stash changes if any
          git stash

          # Switch to gh-pages or create it
          git fetch origin gh-pages 2>/dev/null || echo "gh-pages branch does not exist"
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages

          # Remove all files and copy build output
          git rm -rf . 2>/dev/null || true
          cp -r out/* .

          # Create .nojekyll to tell GitHub Pages not to use Jekyll
          touch .nojekyll

          # Add and commit
          git add -A
          git commit -m "Deploy to gh-pages" || echo "Nothing to commit"

          # Push to gh-pages
          git push origin gh-pages --force
